appId: ai.cyphertroopers.colossusx-node-manager
productName: ColossusX Node Manager
executableName: colossusx-node-manager
asar: true
asarUnpack:
  - dist/transfer-store.worker.js
  - dist/windows-pty-host.js
  - node_modules/@lydell/**
  - package.json
npmRebuild: false
beforePack: desktop/before-pack.cjs
directories:
  output: release
  buildResources: desktop
files:
  - dist/**
  - assets/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - README.md
artifactName: "ColossusX-Node-Manager-${version}-${os}-${arch}.${ext}"
win:
  icon: desktop/icon.png
  target:
    - target: portable
      arch:
        - x64
mac:
  icon: desktop/icon.png
  category: public.app-category.finance
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
linux:
  syncDesktopName: true
  icon: desktop/icon.png
  category: Finance
  target:
    - target: AppImage
      arch:
        - x64
