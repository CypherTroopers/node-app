name: Diagnose released macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    name: Inspect the original v0.1.0 Apple silicon DMG
    runs-on: macos-15
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out the diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js for the existing packaged-app proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          architecture: arm64

      - name: Install frozen diagnostic dependencies
        id: dependencies
        continue-on-error: true
        run: |
          corepack enable
          corepack prepare pnpm@12.9.0 --activate
          pnpm install --frozen-lockfile

      - name: Collect integrity, policy, and packaged-app evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/colossusx-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          DIAGNOSTIC_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        run: /bin/bash scripts/diagnose-macos.sh

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-v0.1.0-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/colossusx-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
