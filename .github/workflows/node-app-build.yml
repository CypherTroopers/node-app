name: Node App Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Cypher branch, tag, or commit to freeze for this build
        required: true
        default: FHS-D
        type: string

permissions:
  contents: read

concurrency:
  group: node-app-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Freeze native metadata and validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha256: ${{ steps.snapshot.outputs.source_sha256 }}
    steps:
      - name: Check out the selected app commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"

      - name: Freeze the upstream native commit and hashes
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-native.mjs --ref "$UPSTREAM_REF" --receipt artifacts/native-sync.json

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@12.9.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run the Linux unit and browser suites
        run: pnpm test

      - name: Create the exact prepared source snapshot
        id: snapshot
        env:
          NODE_APP_PREPARED_DIR: ${{ runner.temp }}/node-app-prepared
        run: |
          mkdir -p "$NODE_APP_PREPARED_DIR"
          cp artifacts/native-sync.json "$NODE_APP_PREPARED_DIR/native-sync.json"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./release' --exclude='./artifacts' --exclude='*.tgz' -czf "$NODE_APP_PREPARED_DIR/prepared-source.tgz" .
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { createReadStream } from "node:fs";
          import fs from "node:fs/promises";
          import path from "node:path";
          const directory = process.env.NODE_APP_PREPARED_DIR;
          const receipt = JSON.parse(await fs.readFile("artifacts/native-sync.json", "utf8"));
          const hash = createHash("sha256");
          for await (const bytes of createReadStream(path.join(directory, "prepared-source.tgz"))) hash.update(bytes);
          const sourceSha256 = hash.digest("hex");
          const metadata = {
            appRepository: process.env.GITHUB_REPOSITORY,
            appSourceCommit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            preparedSourceSha256: sourceSha256,
            nodePinsSha256: createHash("sha256").update(await fs.readFile("src/native/node-pins.ts")).digest("hex"),
            nativeRepository: receipt.repository,
            nativeDistributionCommit: receipt.distributionCommit,
            nativeSourceCommit: receipt.sourceCommit,
          };
          await fs.writeFile(path.join(directory, "source.json"), JSON.stringify(metadata, null, 2) + "\n");
          await fs.appendFile(process.env.GITHUB_OUTPUT, `source_sha256=${sourceSha256}\n`);
          NODE

      - name: Upload prepared source and native provenance
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/node-app-prepared/prepared-source.tgz
            ${{ runner.temp }}/node-app-prepared/source.json
            ${{ runner.temp }}/node-app-prepared/native-sync.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build:
    name: Package ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            native_target: linux-amd64
            script: dist:linux
            suffix: .AppImage
          - id: windows-x64
            runner: windows-2022
            platform: win32
            arch: x64
            native_target: windows-amd64
            script: dist:win
            suffix: .exe
          - id: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            native_target: darwin-arm64
            script: dist:mac
            suffix: .dmg
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Require macOS release signing credentials
        if: matrix.platform == 'darwin'
        working-directory: .
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Configure the required macOS release repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Download this run's exact prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: prepared-source
          merge-multiple: true

      - name: Set up the native Node.js architecture
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          architecture: ${{ matrix.arch }}

      - name: Verify and extract the prepared source
        working-directory: .
        env:
          EXPECTED_SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { createReadStream } from "node:fs";
          const hash = createHash("sha256");
          for await (const bytes of createReadStream("prepared-source/prepared-source.tgz")) hash.update(bytes);
          assert.equal(hash.digest("hex"), process.env.EXPECTED_SOURCE_SHA256, "Prepared source hash mismatch");
          NODE
          mkdir app
          tar -xzf prepared-source/prepared-source.tgz -C app
          mkdir -p app/artifacts
          cp prepared-source/native-sync.json app/artifacts/native-sync.json

      - name: Verify the frozen pins and native host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import fs from "node:fs/promises";
          const source = JSON.parse(await fs.readFile("../prepared-source/source.json", "utf8"));
          assert.equal(createHash("sha256").update(await fs.readFile("src/native/node-pins.ts")).digest("hex"), source.nodePinsSha256);
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          NODE

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@12.9.0 --activate

      - name: Install frozen native dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the prepared source
        run: pnpm typecheck

      - name: Verify the embedded desktop runtime
        timeout-minutes: 2
        run: |
          pnpm build
          node scripts/verify-desktop-runtime.mjs

      - name: Build the native installer without publishing
        if: matrix.platform != 'darwin'
        run: pnpm run ${{ matrix.script }}

      - name: Build the signed and notarized macOS installer without publishing
        if: matrix.platform == 'darwin'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run dist:mac

      - name: Verify the finished macOS release image
        if: matrix.platform == 'darwin'
        timeout-minutes: 3
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/verify-macos-release.sh

      - name: Verify the packaged Windows runtime
        if: matrix.platform == 'win32'
        timeout-minutes: 2
        run: node scripts/verify-desktop-runtime.mjs --packaged-windows

      - name: Record installer checksums and provenance
        env:
          INSTALLER_SUFFIX: ${{ matrix.suffix }}
          NATIVE_TARGET: ${{ matrix.native_target }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { createReadStream } from "node:fs";
          import fs from "node:fs/promises";
          import path from "node:path";
          const source = JSON.parse(await fs.readFile("../prepared-source/source.json", "utf8"));
          const native = JSON.parse(await fs.readFile("artifacts/native-sync.json", "utf8"));
          const installers = (await fs.readdir("release")).filter((name) => name.endsWith(process.env.INSTALLER_SUFFIX));
          assert.equal(installers.length, 1, "Expected exactly one native installer");
          const file = installers[0];
          const filename = path.join("release", file);
          const hash = createHash("sha256");
          for await (const bytes of createReadStream(filename)) hash.update(bytes);
          const installer = { file, bytes: (await fs.stat(filename)).size, sha256: hash.digest("hex") };
          const receipt = {
            ...source,
            nativeTarget: process.env.NATIVE_TARGET,
            platform: process.platform,
            arch: process.arch,
            node: process.versions.node,
            installer,
          };
          assert.equal(native.distributionCommit, source.nativeDistributionCommit);
          await fs.copyFile("artifacts/native-sync.json", "release/native-sync.json");
          await fs.writeFile("release/SHA256SUMS", `${installer.sha256}  ${file}\n`);
          await fs.writeFile("release/build-receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          NODE

      - name: Upload the installer, checksum, and native pins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colossusx-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/release/*${{ matrix.suffix }}
            app/release/SHA256SUMS
            app/release/native-sync.json
            app/release/build-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
